<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Aprovações - Nexus StorageControl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-lg bg-teal-500 flex items-center justify-center font-bold text-white text-lg">N</div>
                <span class="font-bold text-lg tracking-tight font-heading">Nexus <span class="text-teal-400 font-normal">StorageControl</span></span>
            </div>

            <nav class="hidden md:flex space-x-1">
                <a href="dashboard.html" class="px-3 py-2 rounded-md text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white">Dashboard</a>
                <a href="insumos.html" class="px-3 py-2 rounded-md text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white">Catálogo & Insumos</a>
                <a href="movimentacoes.html" class="px-3 py-2 rounded-md text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white">Movimentações & QR</a>
                <a href="requisicoes.html" class="px-3 py-2 rounded-md text-sm font-medium bg-teal-700 text-white">Aprovações</a>
                <a href="relatorios.html" class="px-3 py-2 rounded-md text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white">Relatórios & Auditoria</a>
            </nav>

            <div class="flex items-center space-x-3">
                <span id="offline-badge" class="hidden px-2 py-1 bg-amber-500 text-slate-950 font-mono text-xs font-bold rounded">0 pendentes offline</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-8 space-y-6">

        <!-- Title -->
        <div class="border-b pb-4 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold text-slate-900 font-heading">Painel de Aprovações de Gestor</h1>
                <p class="text-sm text-slate-500">Solicitações de retirada com valor &gt; R$ 50,00 ou categorias controladas</p>
            </div>
            <span class="text-xs bg-amber-100 text-amber-800 font-bold px-3 py-1 rounded-full">SLA SLA 48h</span>
        </div>

        <!-- Lista de Requisições -->
        <div id="lista-requisicoes-pendentes" class="space-y-4">
            <!-- Preenchido dinamicamente via requisicoes.js -->
        </div>

    </main>

    <script type="module" src="js/requisicoes.js"></script>
    <script type="module" src="js/offline-sync.js"></script>
</body>
</html>
